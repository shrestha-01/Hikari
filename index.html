<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikari</title>
    <link rel="stylesheet" href="style_01.css">
    <link rel="icon" type="image/jpeg" href="Logo/Logo.jpeg?v=1.2">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-0QS00603GF"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-0QS00603GF');
    </script>
</head>

<body>
    <div class="bgPoster" id="bgPoster"></div>
    <div class="topWrap">
        <div class="logoBlock">
            <div class="siteTitle">Hikari✦</div>
            <div class="jpTitle">ヒカリ</div>
        </div>
        <div class="topNav">
            <div class="categories" id="categories">
                <button data-mode="anime" class="selected">Anime</button>
                <button data-mode="manga">Manga</button>
                <!-- <button data-mode="cartoon">Cartoon</button>
                <button data-mode="movie">Movie</button>
                <button data-mode="games">Games</button> -->
            </div>
            <button class="categorybtn" id="categorybtn">Category</button>
        </div>
    </div>
    <div class="filterBar">
        <button id="whichgenre">Choose Genres</button>
        <div class="genresbox" id="genresbox">
            <button class="genreBtn" data-genre="Action">Action</button>
            <button class="genreBtn" data-genre="Adventure">Adventure</button>
            <button class="genreBtn" data-genre="Comedy">Comedy</button>
            <button class="genreBtn" data-genre="Drama">Drama</button>
            <button class="genreBtn" data-genre="Ecchi">Ecchi</button>
            <button class="genreBtn" data-genre="Fantasy">Fantasy</button>
            <button class="genreBtn" data-genre="Horror">Horror</button>
            <button class="genreBtn" data-genre="Mahou Shoujo">Mahou Shoujo</button>
            <button class="genreBtn" data-genre="Mecha">Mecha</button>
            <button class="genreBtn" data-genre="Music">Music</button>
            <button class="genreBtn" data-genre="Mystery">Mystery</button>
            <button class="genreBtn" data-genre="Psychological">Psychological</button>
            <button class="genreBtn" data-genre="Romance">Romance</button>
            <button class="genreBtn" data-genre="Sci-Fi">Sci-Fi</button>
            <button class="genreBtn" data-genre="Slice of Life">Slice of Life</button>
            <button class="genreBtn" data-genre="Sports">Sports</button>
            <!-- <button class="genreBtn" data-genre="Kids">Kids</button> -->
            <button class="genreBtn" data-genre="Supernatural">Supernatural</button>
            <button class="genreBtn" data-genre="Thriller">Thriller</button>

        </div>
    </div>
    <div class="infoArea">
        <div class="posterCard">
            <div class="cardNotch"></div>
            <img class="posterImg" id="posterImg" alt="">
        </div>
        <!-- <div class="rightInfo">
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="genreList" id="genreList"></div>
        </div> -->
        <div class="rightInfo">
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="infocap" id="inofcap">
                <div id="avgscore"></div>
                <div id="startDate"></div>
                <div id="statusrn"></div>
            </div>
            <div class="genreList" id="genreList"></div>
            <div class="describe" id="describe"></div>
        </div>
    </div>
    <div class="theButtons">
        <button class="back" id="backBtn" disabled>◄Back</button>
        <button class="whatsnext" id="whatsNext">
            <span id="btnText">What's Next?</span>
        </button>
        <button class="forward" id="nextBtn" disabled>Forward►</button>
    </div>
    <script src="script_01.js"></script>
    <script src="script_02.js"></script>
</body>

</html>
