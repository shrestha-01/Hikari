<html lang="en">

<head>
    <meta charset="UTF-8">

<body>
    <!-- <video class="bgVideo" id="bgVideo" autoplay loop muted playsinline>

    <div class="bgPoster" id="bgPoster"></div>
    <div class="topWrap">
        <div class="logoBlock">
            <div class="siteTitle">Hikari <span class="star">✦</span></div>
            <div class="jpTitle">ヒカリ</div>
        </div>
        <div class="topNav">
            <div class="categories" id="categories">
                <button data-mode="anime" class="selected">Anime</button>
                <button data-mode="manga">Manga</button>
                <button data-mode="movie">Movie</button>
                <!-- <button data-mode="cartoon">Cartoon</button>
                <button data-mode="games">Games</button> -->
            </div>
            <button class="categorybtn" id="categorybtn">Category</button>
        </div>
    </div>
    <div class="filterBar">
        <button id="whichgenre">Choose Genres</button>
        <div class="genresbox" id="genresbox">
            <button class="genreBtn" data-genre="Action">Action</button>
            <button class="genreBtn" data-genre="Adventure">Adventure</button>
            <button class="genreBtn" data-genre="Comedy">Comedy</button>
            <button class="genreBtn" data-genre="Drama">Drama</button>
            <button class="genreBtn" data-genre="Ecchi">Ecchi</button>
            <button class="genreBtn" data-genre="Fantasy">Fantasy</button>
            <button class="genreBtn" data-genre="Horror">Horror</button>
            <button class="genreBtn" data-genre="Mahou Shoujo">Mahou Shoujo</button>
            <button class="genreBtn" data-genre="Mecha">Mecha</button>
            <button class="genreBtn" data-genre="Music">Music</button>
            <button class="genreBtn" data-genre="Mystery">Mystery</button>
            <button class="genreBtn" data-genre="Psychological">Psychological</button>
            <button class="genreBtn" data-genre="Romance">Romance</button>
            <button class="genreBtn" data-genre="Sci-Fi">Sci-Fi</button>
            <button class="genreBtn" data-genre="Slice of Life">Slice of Life</button>
            <button class="genreBtn" data-genre="Sports">Sports</button>
            <!-- <button class="genreBtn" data-genre="Kids">Kids</button> -->
            <button class="genreBtn" data-genre="Supernatural">Supernatural</button>
            <button class="genreBtn" data-genre="Thriller">Thriller</button>

        </div>
        <div class="genresbox" id="movgenresbox">
            <button class="genreBtn" data-genre="Action">Action</button>
            <button class="genreBtn" data-genre="Adventure">Adventure</button>
            <button class="genreBtn" data-genre="Animation">Animation</button>
            <button class="genreBtn" data-genre="Comedy">Comedy</button>
            <button class="genreBtn" data-genre="Crime">Crime</button>
            <button class="genreBtn" data-genre="Documentary">Documentary</button>
            <button class="genreBtn" data-genre="Drama">Drama</button>
            <button class="genreBtn" data-genre="Family">Family</button>
            <button class="genreBtn" data-genre="Fantasy">Fantasy</button>
            <button class="genreBtn" data-genre="History">History</button>
            <button class="genreBtn" data-genre="Horror">Horror</button>
            <button class="genreBtn" data-genre="Music">Music</button>
            <button class="genreBtn" data-genre="Mystery">Mystery</button>
            <button class="genreBtn" data-genre="Romance">Romance</button>
            <button class="genreBtn" data-genre="Science Fiction">Sci-Fi</button>
            <button class="genreBtn" data-genre="Thriller">Thriller</button>
            <button class="genreBtn" data-genre="War">War</button>
            <button class="genreBtn" data-genre="Western">Western</button>
        </div>
    </div>
    <div class="infoArea">
        <div class="posterCard">
            <div class="notchbleft"></div>
            <div class="cardNotch"></div>
            <div class="notchbright"></div>
            <img class="posterImg" id="posterImg" alt="">
            <video class="loadingClip" id="loadingClip" src="Logo/loading.webm" muted loop
                style="display: none;"></video>
            <iframe class="trailerFrame" id="trailerFrame" allow="autoplay" style="display: none;"></iframe>
            <div class="cardGlow"></div>
        </div>
        <!-- <div class="rightInfo">
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="genreList" id="genreList"></div>
        </div> -->
        <div class="rightInfo centerMode" id="rightInfo">
            <div class="instruct" id="instruct">Yo buddy, hit that ✦ What's Next? ✦ button and let's find you something
                good (∩˃o˂∩) </div>
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="infocap" id="inofcap">
                <div id="avgscore"></div>
                <div id="startDate"></div>
                <div id="statusrn"></div>
            </div>
            <div class="genreList" id="genreList"></div>
            <div class="describe" id="describe"></div>
            <!-- <button class="trailerBtn" id="trailerBtn" style="display: none;">Watch Trailer</button> -->
            <!-- <div class="trailerWrap" id="trailerWrap" style="display: none;">
                <button class="trailerIconBtn" id="trailerIconBtn">
                    <img class="ytIcon" id="ytIcon" src="Icons/youtube.svg" alt="">
                    <span class="closeX" id="closeX"></span>
                </button>
                <button class="trailerBtn" id="trailerBtn">Watch Trailer</button>
             </div> -->
            <div class="btnRow" id="btnRow">
                <button class="trailerBtn" id="trailerBtn" style="display: none;">
                    <svg class="btnLogo" viewBox="0 0 24 24" width="16" height="16">
                        <rect x="1" y="4" width="22" height="16" rx="5" fill="#FF0000"></rect>
                        <path d="M10 8.5 L17 12 L10 15.5 Z" fill="#FFFFFF"></path>
                    </svg>
                    <span class="btnLabel" id="btnLabel">Watch Trailer</span>
                </button>
                <div class="streamBtns" id="streamBtns" style="display: none;">
                    <a class="streamBtn" id="streamCrunchyroll" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/crunchyroll.svg" alt="Crunchyroll">
                        <span class="streamLabel">Crunchyroll</span>
                    </a>
                    <a class="streamBtn" id="streamNetflix" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/netflix.svg" alt="Netflix">
                        <span class="streamLabel">Netflix</span>
                    </a>
                    <a class="streamBtn" id="streamAnimeSuge" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/animesuge.svg" alt="AnimeSuge">
                        <span class="streamLabel"><span style="color: red;">A</span>nimeSuge</span>
                    </a>
                </div>
                <div class="streamBtns" id="mangaBtns" style="display: none;">
                    <a class="streamBtn" id="streamMangadex" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/mangadex.svg" alt="MangaDex">
                        <span class="streamLabel">MangaDex</span>
                    </a>
                    <a class="streamBtn" id="streamMAL" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/mal.svg" alt="MyAnimeList">
                        <span class="streamLabel">MyAnimeList</span>
                    </a>
                    <a class="streamBtn" id="streamAP" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/animeplanet.png" alt="Anime-Planet">
                        <span class="streamLabel">Anime Planet</span>
                    </a>
                </div>
                <div class="streamBtns" id="movieBtns" style="display: none;">
                    <a class="streamBtn netflixBtn" id="streamMovieNetflix" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/netflix.svg" alt="Netflix">
                        <span class="streamLabel">Netflix</span>
                    </a>
                    <a class="streamBtn" id="streamMoviePrime" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/primevideo.png" alt="Prime Video">
                        <span class="streamLabel">Prime Video</span>
                    </a>
                    <a class="streamBtn" id="streamMovieAppleTv" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/appletv.svg" alt="Apple TV+">
                        <span class="streamLabel">Apple TV+</span>
                    </a>
                    <a class="streamBtn" id="streamMovieMax" target="_blank" rel="noopener">
                        <img class="streamIcon" src="Icons/hbomax.svg" alt="HBO Max">
                        <span class="streamLabel">HBO Max</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

                    </svg>
                </span>
                <span class="trailerBtnText" id="trailerBtnText">Watch Trailer</span>

    </div>
    </div>
    <div class="theButtons">
        <button class="back" id="backBtn" disabled>◄Back</button>
        <button class="whatsnext" id="whatsNext">
            <span id="btnText">What's Next?</span>
        </button>
        <button class="forward" id="nextBtn" disabled>Forward►</button>
    </div>

    <script src="script_02.js?v=1.5"></script>
    <script src="script_03.js?v=1.5"></script>

</html>
