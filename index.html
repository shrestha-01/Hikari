<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hikari</title>
    <link rel="stylesheet" href="style_01.css">
</head>

<body>
    <div class="topWrap">
        <div class="logoBlock">
            <div class="siteTitle">Hikari✦</div>
            <div class="jpTitle">ヒカリ</div>
        </div>
        <div class="topNav">
            <div class="categories" id="categories">
                <button>Anime</button>
                <button>Manga</button>
                <button>Cartoon</button>
                <button>Movie</button>
                <button>Games</button>
            </div>
            <button class="categorybtn" id="categorybtn">Category</button>
        </div>
    </div>
    <div class="filterBar">
        <button id="whichgenre">Choose Genres</button>
        <div class="genresbox" id="genresbox">
            <label class="g">
                <input type="checkbox" value="Action">
                Action
            </label>
            <label class="g">
                <input type="checkbox" value="Adventure">
                Adventure
            </label>
            <label class="g">
                <input type="checkbox" value="Comedy">
                Comedy
            </label>
            <label class="g">
                <input type="checkbox" value="Drama">
                Drama
            </label>
            <label class="g">
                <input type="checkbox" value="Ecchi">
                Ecchi
            </label>
            <label class="g">
                <input type="checkbox" value="Fantasy">
                Fantasy
            </label>
            <label class="g">
                <input type="checkbox" value="Horror">
                Horror
            </label>
            <label class="g">
                <input type="checkbox" value="Mahou Shoujo">
                Mahou Shoujo
            </label>
            <label class="g">
                <input type="checkbox" value="Mecha">
                Mecha
            </label>
            <label class="g">
                <input type="checkbox" value="Music">
                Music
            </label>
            <label class="g">
                <input type="checkbox" value="Mystery">
                Mystery
            </label>
            <label class="g">
                <input type="checkbox" value="Psychological">
                Psychological
            </label>
            <label class="g">
                <input type="checkbox" value="Romance">
                Romance
            </label>
            <label class="g">
                <input type="checkbox" value="Sci-Fi">
                Sci-Fi
            </label>
            <label class="g">
                <input type="checkbox" value="Slice of Life">
                Slice of Life
            </label>
            <label class="g">
                <input type="checkbox" value="Sports">
                Sports
            </label>
            <label class="g">
                <input type="checkbox" value="Supernatural">
                Supernatural
            </label>
            <label class="g">
                <input type="checkbox" value="Thriller">
                Thriller
            </label>
            <!-- <label class="g">
                <input type="checkbox" value="Kids">
                Kids
            </label> -->
        </div>
    </div>
    <div class="infoArea">
        <div class="posterCard">
            <div class="cardNotch"></div>
            <img class="posterImg" id="posterImg" alt="">
        </div>
        <!-- <div class="rightInfo">
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="genreList" id="genreList"></div>
        </div> -->
        <div class="rightInfo">
            <div class="engName" id="engName"></div>
            <div class="jpName" id="jpName"></div>
            <div class="infocap" id="inofcap">
                <div id="avgscore"></div>
                <div id="startDate"></div>
                <div id="statusrn"></div>
            </div>
            <div class="genreList" id="genreList"></div>
            <div class="describe" id="describe"></div>
        </div>
    </div>
    <div class="theButtons">
        <button class="back" id="backBtn">◄Back</button>
        <button class="whatsnext" id="whatsNext">
            <span id="btnText">What's Next?</span>
        </button>
        <button class="forward" id="nextBtn">Forward►</button>
    </div>
    <script src="script_01.js"></script>
</body>

</html>
